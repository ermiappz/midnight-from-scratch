ight="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="270.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">CONFIRMED</text><path d="M 640,368 L 640,488" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="678.1" y="415" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="712" y="430" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">FAILURE</text><g data-node="click"><rect x="40" y="208" width="320" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STEP</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">User clicks</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Start the operation.</text></g><g data-node="pending"><rect x="480" y="208" width="320" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,220 V356" stroke="#7a7a84" stroke-width="3"/><text x="508" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STATE</text><text x="508" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Pending</text><text x="508" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Await confirmation;</text><text x="508" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">handle failure explicitly.</text></g><g data-node="read"><rect x="920" y="208" width="320" height="160" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M932,220 V356" stroke="#0000fe" stroke-width="3"/><text x="948" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">03 / STATE</text><text x="948" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Read + render</text><text x="948" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Read confirmed public state,</text><text x="948" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">then render the result.</text></g><g data-node="error"><rect x="480" y="488" width="320" height="160" rx="24" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="516" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">FAILURE</text><text x="500" y="544" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Controlled error</text><text x="500" y="572" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Report the failure; do not</text><text x="500" y="596" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">render it as confirmed success.</text></g><path d="M40,688 H1240" stroke="#c7c7cc"/><text x="40" y="716" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="716" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">If the operation fails, render a controlled error.
