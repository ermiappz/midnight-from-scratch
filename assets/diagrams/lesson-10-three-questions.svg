<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-10-three-questions-title lesson-10-three-questions-desc" id="lesson-10-three-questions-root"><title id="lesson-10-three-questions-title">Find the record, authorize it, open it</title><desc id="lesson-10-three-questions-desc">Three distinct questions · each input has a different job in the protocol.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-10-three-questions-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-10-three-questions-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-10-three-questions-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-10-three-questions-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-10-three-questions-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 10</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Find the record, authorize it, open it</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Three distinct questions · each input has a different job in the protocol.</text><path d="M 360,328.0 L 480,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-10-three-questions-arrow-gray)"/><path d="M 800,328.0 L 920,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-10-three-questions-arrow-gray)"/><g data-node="id"><rect x="40" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="68" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">ID</text><text x="68" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Which record?</text><text x="68" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Use the public ID</text><text x="68" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">to locate the record.</text></g><g data-node="owner"><rect x="480" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">SECRET</text><text x="500" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Whose record?</text><text x="500" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Check the secret-derived</text><text x="500" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">ownership of that ID.</text></g><g data-node="opening"><rect x="920" y="224" width="320" height="208" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">OPENING</text><text x="940" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Which earlier choice?</text><text x="940" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Check choice + salt against</text><text x="940" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">the stored commitment.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">ID selects a record. The secret authorizes ownership. Choice + salt must match its earlier</text><text x="164" y="636" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">commitment.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 10</text></svg>
