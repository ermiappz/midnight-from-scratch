<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-18-ui-network-title lesson-18-ui-network-desc" id="lesson-18-ui-network-root"><title id="lesson-18-ui-network-title">Close the UI loop with public-state refresh</title><desc id="lesson-18-ui-network-desc">UI integration · the private notebook retains the opening locally throughout the transaction flow.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-18-ui-network-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-18-ui-network-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-18-ui-network-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-18-ui-network-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-18-ui-network-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="872" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 18</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Close the UI loop with public-state refresh</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">UI integration · the private notebook retains the opening locally throughout the transaction flow.</text><path d="M 360,300.0 L 480,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-18-ui-network-arrow-gray)"/><path d="M 800,300.0 L 920,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-18-ui-network-arrow-gray)"/><path d="M 1080.0,392 L 1080.0,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-18-ui-network-arrow-gray)"/><path d="M 920,540 L 208,540 Q 200,540 200,532 L 200,392" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-18-ui-network-arrow-gray)" stroke-dasharray="6 5"/><rect x="515.0" y="507" width="90.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="560" y="522" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">REFRESH UI</text><g data-node="user"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STEP</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">User + UI</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Start the requested action.</text></g><g data-node="providers"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STEP</text><text x="500" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Wallet / providers</text><text x="500" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Build and submit</text><text x="500" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">the transaction.</text></g><g data-node="confirm"><rect x="920" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="948" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STATE</text><text x="948" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Confirmation</text><text x="948" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Wait for the network result.</text></g><g data-node="refresh"><rect x="920" y="448" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M932,460 V620" stroke="#0000fe" stroke-width="3"/><text x="948" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">04 / STORE</text><text x="948" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Refresh public state</text><text x="948" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Read back the contract state</text><text x="948" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">and return it to the UI.</text></g><path d="M40,736 H1240" stroke="#c7c7cc"/><text x="40" y="764" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="764" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">After confirmation, refresh public state and update the UI. The opening remains in the local</text><text x="164" y="788" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">private notebook.</text><text x="40" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Solid arrows: transaction flow · Dashed arrow: confirmed public-state refresh</text><text x="1240" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 18</text></svg>
