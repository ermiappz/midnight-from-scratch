<body><main><h1>Seal a choice, then open the same choice</h1><div class="diagram-container"><svg viewBox="0 0 1280 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-commitment-title course-commitment-desc"><title id="course-commitment-title">Seal a choice, then open the same choice</title><desc id="course-commitment-desc">Commitment flow · the contract compares a recomputed fingerprint with the stored one.</desc><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="872" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  COURSE OVERVIEW</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Seal a choice, then open the same choice</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Commitment flow · the contract compares a recomputed fingerprint with the stored one.</text><path d="M 360,300.0 L 480,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 800,300.0 L 920,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 1080.0,392 L 1080.0,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><g data-node="opening"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / PRIVATE</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Private opening</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">choice + secret salt</text><text x="60" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Keep the pair for later.</text></g><g data-node="seal"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="508" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STORE</text><text x="508" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Commitment</text><text x="508" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Store a sealed fingerprint</text><text x="508" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">in the public ledger.</text></g><g data-node="later"><rect x="920" y="208" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">03 / STEP</text><text x="940" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Recompute + compare</text><text x="940" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Supply the same choice and salt.</text><text x="940" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Compare with the stored value.</text></g><g data-node="reveal"><rect x="920" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,460 V620" stroke="#7a7a84" stroke-width="3"/><text x="948" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">04 / STORE</text><text x="948" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public rating</text><text x="948" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Only a matching opening</text><text x="948" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">may disclose the rating.</text></g><path d="M40,736 H1240" stroke="#c7c7cc"/><text x="40" y="764" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="764" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The opening must match the earlier commitment. The choice becomes public; the secret salt stays</text><text x="164" y="788" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">local in this design.</text><text x="40" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Dashed border: private input · Inset rule: stored state · Blue: key idea</text><text x="1240" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">COURSE OVERVIEW</text></svg></div></main></body>
