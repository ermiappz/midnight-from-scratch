<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-selective-disclosure-title course-selective-disclosure-desc" id="course-selective-disclosure-root"><title id="course-selective-disclosure-title">Choose what becomes public</title><desc id="course-selective-disclosure-desc">Information boundary · a private source does not make its disclosed value private.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #course-selective-disclosure-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #course-selective-disclosure-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#course-selective-disclosure-root .diagram-container { overflow-x:visible; }
}</style><marker id="course-selective-disclosure-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="course-selective-disclosure-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  COURSE OVERVIEW</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Choose what becomes public</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Information boundary · a private source does not make its disclosed value private.</text><path d="M 360,328.0 L 480,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#course-selective-disclosure-arrow-gray)"/><rect x="386.1" y="295.0" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">WITNESS</text><path d="M 800,328.0 L 920,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#course-selective-disclosure-arrow-gray)"/><rect x="822.4" y="295.0" width="75.2" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">DISCLOSE</text><g data-node="private"><rect x="40" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / PRIVATE</text><text x="60" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Local notebook</text><text x="60" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Private application data</text><text x="60" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">is read through a witness.</text></g><g data-node="circuit"><rect x="480" y="224" width="320" height="208" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="500" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">02 / STEP</text><text x="500" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Circuit</text><text x="500" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Enforce the contract’s checks</text><text x="500" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">and choose what to disclose.</text><text x="500" y="412" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">disclose(value)</text></g><g data-node="public"><rect x="920" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="948" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STORE</text><text x="948" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public state</text><text x="948" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">The disclosed value can be</text><text x="948" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">read from the contract ledger.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">disclose(value) deliberately exposes that chosen value in public contract state.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Dashed border: private input · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">COURSE OVERVIEW</text></svg>
