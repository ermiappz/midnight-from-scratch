<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-16-test-the-test-title lesson-16-test-the-test-desc" id="lesson-16-test-the-test-root"><title id="lesson-16-test-the-test-title">A useful test distinguishes correct from broken</title><desc id="lesson-16-test-the-test-desc">Test sensitivity · run the same test against two implementations.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-16-test-the-test-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-16-test-the-test-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-16-test-the-test-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-16-test-the-test-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-16-test-the-test-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="752" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 16</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">A useful test distinguishes correct from broken</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Test sensitivity · run the same test against two implementations.</text><path d="M 408,304 L 552,304 Q 560,304 560,296 L 560,280 Q 560,272 568,272 L 752,272" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-16-test-the-test-arrow-gray)"/><rect x="622.1" y="239" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="656" y="254" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">CORRECT</text><path d="M 408,408 L 584,408 Q 592,408 592,416 L 592,488 Q 592,496 600,496 L 752,496" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-16-test-the-test-arrow-gray)"/><rect x="637.8" y="463" width="60.400000000000006" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="668" y="478" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">BROKEN</text><g data-node="test"><rect x="40" y="264" width="368" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="292" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="60" y="320" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">One test</text><text x="60" y="348" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Same asserted behavior;</text><text x="60" y="372" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">change the fixture under test.</text></g><g data-node="correct"><rect x="752" y="192" width="488" height="160" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M764,204 V340" stroke="#0000fe" stroke-width="3"/><text x="780" y="220" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STATE</text><text x="780" y="248" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Correct fixture</text><text x="780" y="276" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">The test must PASS.</text></g><g data-node="broken"><rect x="752" y="416" width="488" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M764,428 V564" stroke="#7a7a84" stroke-width="3"/><text x="780" y="444" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STATE</text><text x="780" y="472" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Broken fixture</text><text x="780" y="500" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">The test must FAIL.</text></g><path d="M40,616 H1240" stroke="#c7c7cc"/><text x="40" y="644" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="644" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Passing only the correct fixture is not enough: the intentionally broken fixture must also make</text><text x="164" y="668" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">the test fail.</text><text x="40" y="724" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="724" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 16</text></svg>
