}</style><marker id="lesson-06-read-only-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-06-read-only-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 06</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Return a value without changing the rating</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Read-only calls · results answer questions about the same existing context.</text><path d="M 392,296 L 528,296 Q 536,296 536,288 L 536,280 Q 536,272 544,272 L 688,272" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-06-read-only-arrow-gray)"/><path d="M 392,384 L 560,384 Q 568,384 568,392 L 568,464 Q 568,472 576,472 L 688,472" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-06-read-only-arrow-gray)"/><g data-node="state"><rect x="40" y="256" width="352" height="176" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,268 V420" stroke="#7a7a84" stroke-width="3"/><text x="68" y="284" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STATE</text><text x="68" y="312" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Current context</text><text x="68" y="340" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">rating = 5</text></g><g data-node="read"><rect x="688" y="200" width="552" height="144" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="708" y="228" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="708" y="256" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">readRating()</text><text x="708" y="284" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Return result: 5n.</text></g><g data-node="bool"><rect x="688" y="400" width="552" height="144" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="708" y="428" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STEP</text><text x="708" y="456" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">isFiveStars()</text><text x="708" y="484" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Return result: true.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Both calls leave the stored rating at 5. A return value is separate from a public-state update.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 06</text></svg>
