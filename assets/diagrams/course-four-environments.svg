<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-four-environments-title course-four-environments-desc" id="course-four-environments-root"><title id="course-four-environments-title">One ratings app, four environments</title><desc id="course-four-environments-desc">The ratings application progresses from local development to public preview, preprod rehearsal, and mainnet production with distinct wallets, addresses, and observations.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #course-four-environments-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #course-four-environments-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#course-four-environments-root .diagram-container { overflow-x:visible; }
}</style><marker id="course-four-environments-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="course-four-environments-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="840" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  COURSE / DEPLOYMENT PATH</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">One ratings app, four environments</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Promote reviewed source; establish fresh evidence on each chain.</text><path d="M 304,344 L 352,344" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#course-four-environments-arrow-gray)"/><path d="M 616,344 L 664,344" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#course-four-environments-arrow-gray)"/><path d="M 928,344 L 976,344" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#course-four-environments-arrow-gray)"/><g data-node="undeployed"><rect x="40" y="224" width="264" height="240" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / WORKSHOP</text><text x="60" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Local</text><text x="60" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Fast logic tests, then</text><text x="60" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">real local transactions.</text><text x="60" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Own node + indexer + prover.</text><text x="60" y="444" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">undeployed</text></g><g data-node="preview"><rect x="352" y="224" width="264" height="240" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="372" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">02 / PRACTICE</text><text x="372" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Preview</text><text x="372" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Shared early experiments.</text><text x="372" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Invite a second tester.</text><text x="372" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Use independent wallets.</text><text x="372" y="444" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">preview</text></g><g data-node="preprod"><rect x="664" y="224" width="264" height="240" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="684" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / REHEARSAL</text><text x="684" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Preprod</text><text x="684" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Repeat the release flow.</text><text x="684" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Test recovery and hosting.</text><text x="684" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Collect confirmation</text><text x="684" y="380" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">evidence.</text><text x="684" y="444" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">preprod</text></g><g data-node="mainnet"><rect x="976" y="224" width="264" height="240" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="996" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">04 / PRODUCTION</text><text x="996" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Mainnet</text><text x="996" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Reviewed release.</text><text x="996" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Real fee resources.</text><text x="996" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Monitor accepted results.</text><text x="996" y="444" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">mainnet</text></g><text x="40" y="524" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">At each transition: rebuild matching artifacts, configure one network, fund its wallet,</text><text x="40" y="548" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">deploy a fresh address, then confirm and read back. Existing chain data does not migrate.</text><text x="40" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">A production frontend build is a file bundle. A mainnet deployment is a chain operation.</text><path d="M40,704 H1240" stroke="#c7c7cc"/><text x="40" y="732" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="732" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Same ratings rules; network-specific services, wallets, addresses, and measured results.</text><text x="40" y="812" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Solid arrow: next learning stage · Blue: shared experimentation · Each stage needs its own evidence</text><text x="1240" y="812" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">Course / deployment path</text></svg>
