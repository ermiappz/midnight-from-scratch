      @media print {
#lesson-20-tie-trace-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-20-tie-trace-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-20-tie-trace-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 20</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">A tie keeps the earlier revealed winner</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Worked state trace · compare each newly revealed bid with the current highest bid.</text><path d="M 360,328.0 L 480,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-tie-trace-arrow-gray)"/><rect x="386.1" y="295.0" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">90 &gt; 70</text><path d="M 800,328.0 L 920,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-tie-trace-arrow-gray)"/><rect x="826.1" y="295.0" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">90 = 90</text><g data-node="alice"><rect x="40" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="68" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STATE</text><text x="68" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Alice reveals 70</text><text x="68" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">highest = 70</text><text x="68" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">winner = Alice</text></g><g data-node="bob"><rect x="480" y="224" width="320" height="208" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M492,236 V420" stroke="#0000fe" stroke-width="3"/><text x="508" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">02 / STATE</text><text x="508" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Bob reveals 90</text><text x="508" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">highest = 90</text><text x="508" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">winner = Bob</text></g><g data-node="carol"><rect x="920" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="948" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STATE</text><text x="948" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Carol reveals 90</text><text x="948" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">highest = 90</text><text x="948" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">winner = Bob (unchanged)</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Carol’s bid equals 90, so it does not replace Bob. The winner changes only for a greater valid</text><text x="164" y="636" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">bid.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 20</text></svg>
