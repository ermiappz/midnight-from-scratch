<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-20-tie-trace-title lesson-20-tie-trace-desc" id="lesson-20-tie-trace-root"><title id="lesson-20-tie-trace-title">A tie keeps the earlier revealed winner</title><desc id="lesson-20-tie-trace-desc">Worked state trace · compare each newly revealed bid with the current highest bid.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
