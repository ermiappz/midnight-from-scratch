<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-05-execution-pipeline-title lesson-05-execution-pipeline-desc" id="lesson-05-execution-pipeline-root"><title id="lesson-05-execution-pipeline-title">Follow one call all the way through</title><desc id="lesson-05-execution-pipeline-desc">Execution pipeline · compilation prepares the module; execution checks and updates the state.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-05-execution-pipeline-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-05-execution-pipeline-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-05-execution-pipeline-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-05-execution-pipeline-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-05-execution-pipeline-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="872" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 05</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Follow one call all the way through</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Execution pipeline · compilation prepares the module; execution checks and updates the state.</text><path d="M 360,300.0 L 480,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-05-execution-pipeline-arrow-gray)"/><path d="M 800,300.0 L 920,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-05-execution-pipeline-arrow-gray)"/><path d="M 1080.0,392 L 1080.0,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-05-execution-pipeline-arrow-gray)"/><path d="M 920,540.0 L 800,540.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-05-execution-pipeline-arrow-gray)"/><path d="M 480,540.0 L 360,540.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-05-execution-pipeline-arrow-gray)"/><g data-node="build"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STEP</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Compile source</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Generate the JavaScript</text><text x="60" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">contract module.</text></g><g data-node="initial"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="508" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STATE</text><text x="508" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Initialize</text><text x="508" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">JS creates initial state</text><text x="508" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">and builds a call context.</text></g><g data-node="circuit"><rect x="920" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="940" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STEP</text><text x="940" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Call exported circuit</text><text x="940" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">The runner supplies</text><text x="940" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">the circuit arguments.</text></g><g data-node="check"><rect x="920" y="448" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">04 / STEP</text><text x="940" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Enforce rules</text><text x="940" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Input checks, then assertion,</text><text x="940" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">then the state update.</text></g><g data-node="result"><rect x="480" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,460 V620" stroke="#7a7a84" stroke-width="3"/><text x="508" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">05 / STATE</text><text x="508" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Execution result</text><text x="508" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Return the updated context</text><text x="508" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">to the JavaScript runner.</text></g><g data-node="display"><rect x="40" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">06 / STEP</text><text x="60" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Decode + display</text><text x="60" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">ledger(...) reads the state</text><text x="60" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">for terminal output.</text></g><path d="M40,736 H1240" stroke="#c7c7cc"/><text x="40" y="764" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="764" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Use ledger(...) to decode the returned public state before displaying its values.</text><text x="40" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 05</text></svg>
