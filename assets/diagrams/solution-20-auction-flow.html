th="1.5" stroke-dasharray="6 5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / PRIVATE</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Private inputs</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">secret + bid + salt</text></g><g data-node="commit"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="508" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STORE</text><text x="508" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Scoped ID + commitment</text><text x="508" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Store the sealed bid under</text><text x="508" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">its contract-scoped identifier.</text></g><g data-node="verify"><rect x="920" y="208" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">03 / STEP</text><text x="940" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Verified public bid</text><text x="940" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Check the opening before</text><text x="940" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">publishing its bid.</text></g><g data-node="winner"><rect x="920" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,460 V620" stroke="#7a7a84" stroke-width="3"/><text x="948" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">04 / STORE</text><text x="948" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Highest / winner</text><text x="948" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Compare the verified bid</text><text x="948" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">and update the result.</text></g><path d="M40,736 H1240" stroke="#c7c7cc"/><text x="40" y="764" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="764" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The secret and salt are private inputs; the verified bid and highest / winner result are public.</text><text x="40" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Dashed border: private input · Inset rule: stored state · Blue: key idea</text><text x="1240" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">REFERENCE / 20</text></svg></div></main></body>
