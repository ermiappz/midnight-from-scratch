}</style><marker id="lesson-09-commit-reveal-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-09-commit-reveal-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="840" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 09</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">The opening must match the sealed choice</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Two moments · the ledger stores a commitment first and publishes the rating only after a match.</text><path d="M 360,300 L 480,300" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-09-commit-reveal-arrow-gray)"/><rect x="389.8" y="267.0" width="60.400000000000006" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420.0" y="282.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">COMMIT</text><path d="M 800,300 L 920,300" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-09-commit-reveal-arrow-gray)"/><rect x="833.5" y="267.0" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="282.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">STORE</text><path d="M 360,560 L 480,560" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-09-commit-reveal-arrow-gray)"/><rect x="378.7" y="527.0" width="82.60000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420.0" y="542.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">RECOMPUTE</text><path d="M 800,560 L 920,560" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-09-commit-reveal-arrow-gray)"/><rect x="833.5" y="527.0" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="542.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">MATCH</text><path d="M 1080,392 L 1080,420 Q 1080,428 1072,428 L 648,428 Q 640,428 640,436 L 640,468" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-09-commit-reveal-arrow-gray)" stroke-dasharray="6 5"/><rect x="794.1" y="395" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="828" y="410" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">COMPARE</text><g data-node="opening"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">PRIVATE</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Private opening</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">choice = 3</text><text x="60" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">random secret salt</text></g><g data-node="commit"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="500" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">persistentCommit</text><text x="500" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Compute the fingerprint</text><text x="500" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">from choice + salt.</text></g><g data-node="sealed"><rect x="920" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="948" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="948" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Committed ledger</text><text x="948" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">32-byte ratingCommitment</text><text x="948" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">hasCommitment = true</text><text x="948" y="340" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">hasRevealed = false; rating = 0</text></g><g data-node="same"><rect x="40" y="468" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="496" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">PRIVATE</text><text x="60" y="524" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Same private opening</text><text x="60" y="552" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Same choice + same salt</text><text x="60" y="576" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Keep the salt local.</text></g><g data-node="verify"><rect x="480" y="468" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="500" y="496" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STEP</text><text x="500" y="524" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Recompute + compare</text><text x="500" y="552" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Must match the stored</text><text x="500" y="576" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">ratingCommitment.</text></g><g data-node="revealed"><rect x="920" y="468" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,480 V640" stroke="#7a7a84" stroke-width="3"/><text x="948" y="496" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="948" y="524" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Revealed ledger</text><text x="948" y="552" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">revealedRating = 3</text><text x="948" y="576" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">hasRevealed = true</text></g><path d="M40,704 H1240" stroke="#c7c7cc"/><text x="40" y="732" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="732" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Changing the choice or salt changes the checked opening. The salt stays local, including during</text><text x="164" y="756" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">reveal.</text><text x="40" y="812" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Dashed border: private opening · Dashed arrow: stored commitment used for comparison · Blue: enforced match</text><text x="1240" y="812" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 09</text></svg>
