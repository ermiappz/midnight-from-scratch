<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-09-commit-reveal-title lesson-09-commit-reveal-desc" id="lesson-09-commit-reveal-root"><title id="lesson-09-commit-reveal-title">The opening must match the sealed choice</title><desc id="lesson-09-commit-reveal-desc">Two moments · the ledger stores a commitment first and publishes the rating only after a match.</desc><defs>
