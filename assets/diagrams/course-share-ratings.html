<body><main><h1>Share the app; keep separate openings</h1><div class="diagram-container"><svg viewBox="0 0 1280 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-share-ratings-title course-share-ratings-desc"><title id="course-share-ratings-title">Share the app; keep separate openings</title><desc id="course-share-ratings-desc">Alice and Bob receive the same public application build and contract address, use independent wallets and local proving, and interact with one shared ratings contract.</desc><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="920" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  COURSE / SHARED RATINGS</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Share the app; keep separate openings</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Two clients join one contract on the same public network.</text><path d="M 360,292 L 480,292" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 200,424 L 200,628 Q 200,636 208,636 L 480,636" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 800,324 L 852,324 Q 860,324 860,332 L 860,432 Q 860,440 868,440 L 920,440" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 800,636 L 872,636 Q 880,636 880,628 L 880,560 Q 880,552 888,552 L 920,552" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><g data-node="release"><rect x="40" y="224" width="320" height="200" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">SHARE THESE</text><text x="60" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public release</text><text x="60" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">App URL + source revision</text><text x="60" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Network + contract address</text><text x="60" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Matching compiled artifacts</text></g><g data-node="alice"><rect x="480" y="224" width="320" height="200" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="500" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">OWN MACHINE</text><text x="500" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Alice’s client</text><text x="500" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Own wallet and opening</text><text x="500" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Local or wallet proving</text><text x="500" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Commit 3; reveal 3</text></g><g data-node="bob"><rect x="480" y="536" width="320" height="200" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="500" y="564" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">OWN MACHINE</text><text x="500" y="592" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Bob’s client</text><text x="500" y="620" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Own wallet and opening</text><text x="500" y="644" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Local or wallet proving</text><text x="500" y="668" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Commit 5; reveal 5</text></g><g data-node="contract"><rect x="920" y="380" width="320" height="232" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M932,392 V600" stroke="#0000fe" stroke-width="3"/><text x="948" y="408" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">SAME NETWORK + ADDRESS</text><text x="948" y="436" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Shared ratings</text><text x="948" y="464" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Checks both participants.</text><text x="948" y="488" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Stores sealed records.</text><text x="948" y="512" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Reveals accepted ratings.</text><text x="948" y="536" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Indexer supplies read-back.</text></g><text x="40" y="688" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Never include seeds, salts,</text><text x="40" y="712" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">passwords, or access tokens</text><text x="40" y="736" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">in the public invitation.</text><path d="M40,784 H1240" stroke="#c7c7cc"/><text x="40" y="812" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="812" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Different wallets + one address = shared state. Different addresses = separate applications.</text><text x="40" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Solid arrow: distribution or transaction path · Dashed border: participant-held data · Blue: shared public contract</text><text x="1240" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">Course / shared ratings</text></svg></div></main></body>
