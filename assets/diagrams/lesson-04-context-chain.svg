<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-04-context-chain-title lesson-04-context-chain-desc" id="lesson-04-context-chain-root"><title id="lesson-04-context-chain-title">Carry state forward between calls</title><desc id="lesson-04-context-chain-desc">State trace · each new context contains the edits made by the previous call.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-04-context-chain-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-04-context-chain-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-04-context-chain-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-04-context-chain-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-04-context-chain-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 04</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Carry state forward between calls</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">State trace · each new context contains the edits made by the previous call.</text><path d="M 360,328.0 L 480,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-04-context-chain-arrow-gray)"/><rect x="389.8" y="295.0" width="60.400000000000006" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">CALL 1</text><path d="M 800,328.0 L 920,328.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-04-context-chain-arrow-gray)"/><rect x="829.8" y="295.0" width="60.400000000000006" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">CALL 2</text><g data-node="zero"><rect x="40" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="68" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STATE</text><text x="68" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Before the first call</text><text x="68" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">edits = 0</text><text x="68" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Pass the initial context.</text></g><g data-node="one"><rect x="480" y="224" width="320" height="208" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M492,236 V420" stroke="#0000fe" stroke-width="3"/><text x="508" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">02 / STATE</text><text x="508" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">After storeMessage</text><text x="508" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">edits = 1</text><text x="508" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Use result.context next.</text></g><g data-node="two"><rect x="920" y="224" width="320" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M932,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="948" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STATE</text><text x="948" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">After the next call</text><text x="948" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">edits = 2</text><text x="948" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">State continues in memory.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Restarting this local runner creates fresh initial state: edits returns to 0.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 04</text></svg>
