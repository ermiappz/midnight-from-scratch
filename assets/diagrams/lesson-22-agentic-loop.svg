<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-22-agentic-loop-title lesson-22-agentic-loop-desc" id="lesson-22-agentic-loop-root"><title id="lesson-22-agentic-loop-title">Agentic Midnight development is an evidence loop</title><desc id="lesson-22-agentic-loop-desc">A seven-stage development loop moves from a product slice through scaffolding, grounding, editing, verification, evidence capture, and context improvement, while every stage writes to a shared evidence record.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #lesson-22-agentic-loop-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-22-agentic-loop-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-22-agentic-loop-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-22-agentic-loop-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-22-agentic-loop-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="848" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 22</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Agentic Midnight development is an evidence loop</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Each pass improves both the application and the context future agents receive.</text><path d="M 732.000,210.334 A 240,240 0 0 1 793.169,247.232" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 852.264,320.000 A 240,240 0 0 1 879.543,446.802" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 863.285,520.000 A 240,240 0 0 1 799.643,611.204" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 652.000,671.700 A 240,240 0 0 1 629.199,671.757" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 481.255,612.000 A 240,240 0 0 1 417.158,521.115" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 400.534,448.000 A 240,240 0 0 1 427.179,321.063" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 485.909,248.000 A 240,240 0 0 1 546.893,210.796" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 640.000,228.000 L 640.000,368.000" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 782.497,318.362 L 716.476,371.012" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 781.983,464.407 L 759.799,459.343" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 726.795,612.233 L 670.439,495.208" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 553.205,612.233 L 609.561,495.208" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 498.017,464.407 L 520.201,459.343" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><path d="M 497.503,318.362 L 563.524,371.012" fill="none" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lesson-22-agentic-loop-arrow-gray)"/><g><rect x="548" y="156" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="640.0" y="186" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Frame</text><text x="640.0" y="208" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">one private slice</text></g><g><rect x="736" y="248" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="828.0" y="278" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Scaffold</text><text x="828.0" y="300" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">create-mn-app</text></g><g><rect x="780" y="448" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="872.0" y="478" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Ground</text><text x="872.0" y="500" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">spec + source + versions</text></g><g><rect x="652" y="612" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="744.0" y="642" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Change</text><text x="744.0" y="664" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">small bounded diff</text></g><g><rect x="444" y="612" width="184" height="72" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="536.0" y="642" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0000fe" text-anchor="middle">Verify</text><text x="536.0" y="664" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">compile + adversarial tests</text></g><g><rect x="316" y="448" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="408.0" y="478" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Record</text><text x="408.0" y="500" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">observed vs inferred</text></g><g><rect x="360" y="248" width="184" height="72" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="452.0" y="278" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="middle">Improve</text><text x="452.0" y="300" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">context + tools + docs</text></g><g><rect x="528.0" y="376.0" width="224" height="112" rx="8" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5" /><text x="640" y="424" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">Evidence record</text><text x="640" y="452" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">observations · limits · friction</text></g><path d="M40,712 H1240" stroke="#c7c7cc"/><text x="40" y="740" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="740" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The agent’s answer is an input. The exit condition is reviewed, reproducible evidence.</text><text x="40" y="820" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Solid ring: work advances · Dashed spokes: evidence writes back · Blue: verification gate</text><text x="1240" y="820" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 22</text></svg>
