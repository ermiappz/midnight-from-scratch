<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-17-two-sessions-title lesson-17-two-sessions-desc" id="lesson-17-two-sessions-root"><title id="lesson-17-two-sessions-title">The notebook connects two sessions</title><desc id="lesson-17-two-sessions-desc">Session handoff · select the matching account, network, contract, and round before restoring.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-17-two-sessions-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-17-two-sessions-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-17-two-sessions-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-17-two-sessions-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-17-two-sessions-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="872" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 17</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">The notebook connects two sessions</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Session handoff · select the matching account, network, contract, and round before restoring.</text><path d="M 360,300.0 L 480,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-17-two-sessions-arrow-gray)"/><path d="M 800,300.0 L 920,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-17-two-sessions-arrow-gray)"/><path d="M 1080.0,392 L 1080.0,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-17-two-sessions-arrow-gray)"/><g data-node="a"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / PRIVATE</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Session A</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">choice + salt</text><text x="60" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Save the private opening.</text></g><g data-node="commit"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,220 V380" stroke="#7a7a84" stroke-width="3"/><text x="508" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STORE</text><text x="508" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Submit commitment</text><text x="508" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Keep the opening locally;</text><text x="508" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">publish only the commitment.</text></g><g data-node="scope"><rect x="920" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="940" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STEP</text><text x="940" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Session B: scope</text><text x="940" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">After restart, select account,</text><text x="940" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">network, contract, and round.</text></g><g data-node="restore"><rect x="920" y="448" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">04 / STEP</text><text x="940" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Restore + reveal</text><text x="940" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Load the saved opening</text><text x="940" y="556" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">for that exact scope.</text></g><path d="M40,736 H1240" stroke="#c7c7cc"/><text x="40" y="764" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="764" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The public commitment can outlive the process. The private opening must remain available for the</text><text x="164" y="788" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">later reveal.</text><text x="40" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Dashed border: private input · Inset rule: stored state · Blue: key idea</text><text x="1240" y="844" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 17</text></svg>
