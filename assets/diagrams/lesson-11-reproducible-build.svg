}</style><marker id="lesson-11-reproducible-build-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-11-reproducible-build-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="816" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 11</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Two preparations, one local run</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Build map · the Compact compiler and npm prepare different things for the runner.</text><path d="M 392,288 L 464,288" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-11-reproducible-build-arrow-gray)"/><rect x="394.1" y="255.0" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="428.0" y="270.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">COMPILE</text><path d="M 816,288 L 888,288" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-11-reproducible-build-arrow-gray)"/><rect x="829.2" y="255.0" width="45.6" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="852.0" y="270.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">NODE</text><path d="M 392,544 L 464,544" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-11-reproducible-build-arrow-gray)"/><rect x="397.8" y="511.0" width="60.400000000000006" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="428.0" y="526.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">NPM CI</text><path d="M 816,544 L 1056,544 Q 1064,544 1064,536 L 1064,368" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-11-reproducible-build-arrow-gray)"/><rect x="910.1" y="511" width="67.80000000000001" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="944" y="526" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">RUNTIME</text><g data-node="src"><rect x="40" y="208" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Compact source</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Compile the contract.</text></g><g data-node="js"><rect x="464" y="208" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="484" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="484" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Generated JS</text><text x="484" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">The runner imports this module.</text></g><g data-node="out"><rect x="888" y="208" width="352" height="160" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M900,220 V356" stroke="#0000fe" stroke-width="3"/><text x="916" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STATE</text><text x="916" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Local result</text><text x="916" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Node executes the runner</text><text x="916" y="316" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">with the installed runtime.</text></g><g data-node="pkg"><rect x="40" y="464" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,476 V612" stroke="#7a7a84" stroke-width="3"/><text x="68" y="492" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="68" y="520" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Manifest + lockfile</text><text x="68" y="548" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">package.json + lockfile</text></g><g data-node="deps"><rect x="464" y="464" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="484" y="492" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="484" y="520" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Installed runtime</text><text x="484" y="548" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">npm ci installs the locked</text><text x="484" y="572" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">JavaScript dependencies.</text></g><path d="M40,680 H1240" stroke="#c7c7cc"/><text x="40" y="708" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="708" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Compile source into JavaScript; use npm ci for reproducible runtime dependencies; then execute the</text><text x="164" y="732" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">runner.</text><text x="40" y="788" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="788" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 11</text></svg>
