<body><main><h1>From one value to an independently verified project</h1><div class="diagram-container"><svg viewBox="0 0 1280 1104" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-learning-path-title course-learning-path-desc"><title id="course-learning-path-title">From one value to an independently verified project</title><desc id="course-learning-path-desc">Course milestones progress from a public value through sealed feedback and an independent capstone to an agent-assisted project whose claims require evidence.</desc><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="1104" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  COURSE OVERVIEW</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">From one value to an independently verified project</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Course milestones · each project adds a responsibility, then the final loop evaluates agent assistance.</text><path d="M 360,300.0 L 480,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 800,300.0 L 920,300.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 1080.0,392 L 1080.0,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 920,540.0 L 800,540.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 480,540.0 L 360,540.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 200.0,632 L 200.0,688" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 360,780.0 L 480,780.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 800,780.0 L 920,780.0" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><g data-node="public"><rect x="40" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">01 / STEP</text><text x="60" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public contract</text><text x="60" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Store and validate a value.</text></g><g data-node="sealed"><rect x="480" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">02 / STEP</text><text x="500" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Sealed rating</text><text x="500" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Commit before revealing.</text></g><g data-node="people"><rect x="920" y="208" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="940" y="236" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">03 / STEP</text><text x="940" y="264" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Multiple participants</text><text x="940" y="292" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Separate and authorize records.</text></g><g data-node="round"><rect x="920" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="940" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">04 / STEP</text><text x="940" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Feedback round</text><text x="940" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Coordinate phases and totals.</text><text x="940" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lesson 15</text></g><g data-node="tests"><rect x="480" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">05 / STEP</text><text x="500" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Adversarial tests</text><text x="500" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Try invalid and unauthorized calls.</text><text x="500" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lesson 16</text></g><g data-node="notebook"><rect x="40" y="448" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="476" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">06 / STEP</text><text x="60" y="504" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Recovery notebook</text><text x="60" y="532" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Recover the original opening.</text><text x="60" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lesson 17</text></g><g data-node="ui"><rect x="40" y="688" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="716" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">07 / STEP</text><text x="60" y="744" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Feedback UI</text><text x="60" y="772" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Wait for confirmed public state.</text><text x="60" y="852" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lesson 18</text></g><g data-node="review"><rect x="480" y="688" width="320" height="184" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="716" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">08 / STEP</text><text x="500" y="744" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Privacy review</text><text x="500" y="772" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Inspect what observers can learn.</text><text x="500" y="852" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lesson 19</text></g><g data-node="capstone"><rect x="920" y="688" width="320" height="184" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="716" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">09 / STEP</text><text x="940" y="744" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Independent + agentic</text><text x="940" y="772" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Build, verify, and log friction.</text><text x="940" y="852" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#0a0a0a" text-anchor="start">Lessons 20–22</text></g><path d="M40,968 H1240" stroke="#c7c7cc"/><text x="40" y="996" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="996" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The final milestone transfers the pattern, then measures whether agent assistance produced</text><text x="164" y="1020" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">reviewed evidence.</text><text x="40" y="1076" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Blue: key idea</text><text x="1240" y="1076" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">COURSE OVERVIEW</text></svg></div></main></body>
