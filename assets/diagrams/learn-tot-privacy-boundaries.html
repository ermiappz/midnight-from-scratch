<body><main><h1>Private from whom?</h1><div class="diagram-container"><svg viewBox="0 0 1280 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learn-tot-privacy-boundaries-title learn-tot-privacy-boundaries-desc"><title id="learn-tot-privacy-boundaries-title">Private from whom?</title><desc id="learn-tot-privacy-boundaries-desc">The application and configured prover handle private opening data, while the network verifies a proof and exposes the contract’s public outputs.</desc><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="920" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LEARN TOT / TRUST BOUNDARIES</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Private from whom?</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Follow an opening through execution, proving, verification, and public state.</text><rect x="16" y="168" width="808" height="280" rx="8" fill="#f0f0ee" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="6 5" /><text x="32" y="196" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">APPLICATION ENVIRONMENT</text><rect x="456" y="480" width="808" height="280" rx="8" fill="#f0f0ee" stroke="#c7c7cc" stroke-width="1.5" /><text x="472" y="508" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">NETWORK / PUBLIC OBSERVERS</text><path d="M 360,320 L 480,320" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="393.5" y="287" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="420" y="302" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">INPUT</text><path d="M 800,320 L 920,320" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="822.4" y="287" width="75.2" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860" y="302" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">PREIMAGE</text><path d="M 1080,416 L 1080,536" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="1121.5" y="443" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="1148" y="458" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">PROOF</text><path d="M 920,632 L 800,632" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="822.4" y="599" width="75.2" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="860" y="614" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">ACCEPTED</text><g data-node="opening"><rect x="40" y="224" width="320" height="192" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">APPLICATION DATA</text><text x="60" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Private opening</text><text x="60" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Choice + random salt</text><text x="60" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Keep both for the reveal.</text><text x="60" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Control storage and logs.</text></g><g data-node="execution"><rect x="480" y="224" width="320" height="192" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="500" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">LOCAL RULES</text><text x="500" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Circuit execution</text><text x="500" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Apply the assertions.</text><text x="500" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Prepare the proving data.</text><text x="500" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Choose public disclosures.</text></g><g data-node="prover"><rect x="920" y="224" width="320" height="192" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="940" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">SENSITIVE INPUTS</text><text x="940" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Configured prover</text><text x="940" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Receives proving inputs.</text><text x="940" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Local or remote service:</text><text x="940" y="356" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">its operator matters.</text></g><g data-node="verifier"><rect x="920" y="536" width="320" height="192" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="940" y="564" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">PROOF + STATEMENT</text><text x="940" y="592" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Network verifier</text><text x="940" y="620" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Checks the proof against</text><text x="940" y="644" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">the public statement.</text><text x="940" y="668" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">No raw opening required.</text></g><g data-node="ledger"><rect x="480" y="536" width="320" height="192" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M492,548 V716" stroke="#7a7a84" stroke-width="3"/><text x="508" y="564" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">OBSERVABLE OUTPUT</text><text x="508" y="592" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public contract state</text><text x="508" y="620" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Published IDs and ratings</text><text x="508" y="644" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">remain observable.</text><text x="508" y="668" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Disclosure is deliberate.</text></g><text x="40" y="560" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Privacy is a relationship:</text><text x="40" y="584" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">name the observer before</text><text x="40" y="608" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">claiming a value is private.</text><path d="M40,784 H1240" stroke="#c7c7cc"/><text x="40" y="812" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="812" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Zero knowledge hides the opening from verification; it does not hide it from a service asked to</text><text x="164" y="836" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">prove it.</text><text x="40" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Dashed box: application-private data · Solid arrow: data or accepted update · Blue: prover trust boundary</text><text x="1240" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">Learn Tot / trust boundaries</text></svg></div></main></body>
