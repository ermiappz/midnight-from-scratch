}</style><marker id="lesson-13-provider-routing-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-13-provider-routing-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="920" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 13</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">Providers connect the app to its dependencies</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Provider architecture · each interface has a concrete service or storage destination.</text><path d="M 408,352 L 544,352 Q 552,352 552,344 L 552,256 Q 552,248 560,248 L 760,248" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-13-provider-routing-arrow-gray)"/><path d="M 408,408 L 760,408" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-13-provider-routing-arrow-gray)"/><path d="M 408,464 L 576,464 Q 584,464 584,472 L 584,592 Q 584,600 592,600 L 760,600" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-13-provider-routing-arrow-gray)"/><path d="M 224,512 L 224,608" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-13-provider-routing-arrow-gray)"/><g data-node="app"><rect x="40" y="320" width="368" height="192" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="348" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="60" y="376" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Application providers</text><text x="60" y="404" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Route each responsibility</text><text x="60" y="428" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">to the right implementation.</text></g><g data-node="public"><rect x="760" y="184" width="480" height="128" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M772,196 V300" stroke="#7a7a84" stroke-width="3"/><text x="788" y="212" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="788" y="240" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Public state</text><text x="788" y="268" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Indexer queries / subscriptions.</text></g><g data-node="proof"><rect x="760" y="360" width="480" height="128" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="780" y="388" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="780" y="416" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Proofs</text><text x="780" y="444" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Proof server.</text></g><g data-node="art"><rect x="760" y="536" width="480" height="128" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M772,548 V652" stroke="#7a7a84" stroke-width="3"/><text x="788" y="564" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="788" y="592" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Artifacts</text><text x="788" y="620" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Compiled files.</text></g><g data-node="private"><rect x="40" y="608" width="504" height="144" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" stroke-dasharray="6 5" /><text x="60" y="636" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">PRIVATE</text><text x="60" y="664" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Private storage</text><text x="60" y="692" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Private state + maintenance keys</text><text x="60" y="716" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">stay in the local store.</text></g><path d="M40,784 H1240" stroke="#c7c7cc"/><text x="40" y="812" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="812" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">Public-state access, proving, artifact loading, and local private storage are separate</text><text x="164" y="836" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">responsibilities.</text><text x="40" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Dashed border: private input · Inset rule: stored state · Blue: key idea</text><text x="1240" y="892" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 13</text></svg>
