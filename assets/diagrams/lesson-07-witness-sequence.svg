 sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="middle">JS witness</text><path d="M1104,252 V716" fill="none" stroke="#7a7a84" stroke-dasharray="5 5"/><rect x="968" y="192" width="272" height="60" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="1104" y="230" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="middle">Public ledger</text><path d="M 180,304 L 488,304" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-gray)"/><rect x="215.8" y="272" width="236.39999999999998" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="334.0" y="290" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">applyPreferredRating(context)</text><path d="M 488,376 L 796,376" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-gray)"/><rect x="542.8" y="344" width="198.39999999999998" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="642.0" y="362" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">preferredRating(context)</text><path d="M 796,448 L 488,448" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-gray)" stroke-dasharray="6 5"/><rect x="565.6" y="416" width="152.79999999999998" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="642.0" y="434" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">[privateState, 4n]</text><path d="M 488,520 L 1104,520" fill="none" stroke="#0000fe" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-blue)"/><rect x="858.4" y="488" width="183.2" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="950.0" y="506" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">assert 1…5; disclose 4</text><path d="M 488,592 L 180,592" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-gray)" stroke-dasharray="6 5"/><rect x="196.8" y="560" width="274.4" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="334.0" y="578" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">execution result + updated context</text><path d="M 180,664 L 1104,664" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-07-witness-sequence-arrow-gray)"/><rect x="820.4" y="632" width="259.2" height="24" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="950.0" y="650" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">ledger(...) → read public rating</text><path d="M40,744 H1240" stroke="#c7c7cc"/><text x="40" y="772" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="772" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The runtime asks JavaScript for the witness value during execution; the circuit still enforces the</text><text x="164" y="796" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">rating rule.</text><text x="40" y="852" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Solid arrow: call / update · Dashed arrow: returned value · Time runs downward</text><text x="1240" y="852" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 07</text></svg>
