<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-01-manifest-title lesson-01-manifest-desc" id="lesson-01-manifest-root"><title id="lesson-01-manifest-title">A manifest describes the package</title><desc id="lesson-01-manifest-desc">Configuration map · naming the project and preventing accidental publication are separate fields.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-01-manifest-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-01-manifest-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-01-manifest-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-01-manifest-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-01-manifest-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 01</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">A manifest describes the package</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Configuration map · naming the project and preventing accidental publication are separate fields.</text><path d="M 392,288 L 532,288 Q 540,288 540,280 L 540,272 Q 540,264 548,264 L 688,264" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-01-manifest-arrow-gray)"/><path d="M 392,384 L 556,384 Q 564,384 564,392 L 564,448 Q 564,456 572,456 L 688,456" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-01-manifest-arrow-gray)"/><g data-node="pkg"><rect x="40" y="240" width="352" height="200" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M52,252 V428" stroke="#7a7a84" stroke-width="3"/><text x="68" y="268" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STORE</text><text x="68" y="296" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">package.json</text><text x="68" y="324" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Project configuration</text><text x="68" y="348" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">No application code yet.</text></g><g data-node="name"><rect x="688" y="192" width="552" height="144" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="708" y="220" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="708" y="248" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">name</text><text x="708" y="276" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">A project label.</text></g><g data-node="private"><rect x="688" y="384" width="552" height="144" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="708" y="412" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STEP</text><text x="708" y="440" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">private: true</text><text x="708" y="468" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Block npm publication of</text><text x="708" y="492" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">this package.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">private: true is an npm publishing setting, not a blockchain privacy setting.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Blue: key idea</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 01</text></svg>
