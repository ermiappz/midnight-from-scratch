<body><main><h1>One stage, one feedback loop</h1><div class="diagram-container"><svg viewBox="0 0 1280 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exercise-feedback-loop-title exercise-feedback-loop-desc"><title id="exercise-feedback-loop-title">One stage, one feedback loop</title><desc id="exercise-feedback-loop-desc">Practice loop · the check evaluates your exercise files and reports what is missing.</desc><defs><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="824" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  EXERCISE LOOP</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">One stage, one feedback loop</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Practice loop · the check evaluates your exercise files and reports what is missing.</text><path d="M 392,304 L 464,304" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 816,304 L 888,304" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><path d="M 1064,384 L 1064,496" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="1081.2" y="427" width="45.6" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="1104" y="442" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">PASS</text><path d="M 1000,384 L 1000,432 Q 1000,440 992,440 L 648,440 Q 640,440 640,448 L 640,496" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)"/><rect x="777.2" y="407" width="45.6" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="800" y="422" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">FAIL</text><path d="M 464,572 L 432,572 Q 424,572 424,564 L 424,336 Q 424,328 432,328 L 464,328" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#arrow-gray)" stroke-dasharray="6 5"/><rect x="349.5" y="439" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="376" y="454" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">RETRY</text><g data-node="read"><rect x="40" y="224" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="60" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="60" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Read the stage</text><text x="60" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Identify its one new requirement.</text></g><g data-node="edit"><rect x="464" y="224" width="352" height="160" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="484" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="484" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Edit your starter</text><text x="484" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Work in the exercise folder.</text></g><g data-node="check"><rect x="888" y="224" width="352" height="160" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><text x="908" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">STEP</text><text x="908" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Run the stage check</text><text x="908" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">npm run check -- 3A</text></g><g data-node="fix"><rect x="464" y="496" width="352" height="152" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><text x="484" y="524" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STEP</text><text x="484" y="552" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Fix the reported issue</text><text x="484" y="580" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Use the failure message.</text></g><g data-node="pass"><rect x="888" y="496" width="352" height="152" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M900,508 V636" stroke="#7a7a84" stroke-width="3"/><text x="916" y="524" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">STATE</text><text x="916" y="552" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">Record + proceed</text><text x="916" y="580" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Save this passing revision;</text><text x="916" y="604" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">continue to the next stage.</text></g><path d="M40,688 H1240" stroke="#c7c7cc"/><text x="40" y="716" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="716" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">A pass records the checked revision. A failure gives you a concrete requirement to fix before</text><text x="164" y="740" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">continuing.</text><text x="40" y="796" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Arrows: flow / transition · Inset rule: stored state · Dashed arrow: retry · Blue: key idea</text><text x="1240" y="796" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">EXERCISE LOOP</text></svg></div></main></body>
