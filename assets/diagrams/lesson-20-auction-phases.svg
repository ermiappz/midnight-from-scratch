<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lesson-20-auction-phases-title lesson-20-auction-phases-desc" id="lesson-20-auction-phases-root"><title id="lesson-20-auction-phases-title">A sealed auction moves through three phases</title><desc id="lesson-20-auction-phases-desc">Capstone state machine · reveal verifies an opening before it can affect the winner.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
      #lesson-20-auction-phases-root { color: #0a0a0a; font-family: Outfit, Arial, sans-serif; }
      #lesson-20-auction-phases-root .diagram-container { width:100%; overflow-x:auto; }
      @media print {
#lesson-20-auction-phases-root .diagram-container { overflow-x:visible; }
}</style><marker id="lesson-20-auction-phases-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#54545c"/></marker><marker id="lesson-20-auction-phases-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0000fe"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><rect x="40" y="40" width="8" height="32" rx="0" fill="#0000fe" stroke="#0000fe" stroke-width="1.5" /><text x="64" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">MIDNIGHT FROM SCRATCH  /  LESSON 20</text><text x="40" y="112" font-family="Outfit, Arial, sans-serif" font-size="32" font-weight="500" fill="#0a0a0a" text-anchor="start">A sealed auction moves through three phases</text><text x="40" y="144" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Capstone state machine · reveal verifies an opening before it can affect the winner.</text><path d="M 376,328 L 496,328" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-auction-phases-arrow-gray)"/><rect x="387.3" y="295.0" width="97.4" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="436.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">OPEN REVEAL</text><path d="M 784,328 L 904,328" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-auction-phases-arrow-gray)"/><rect x="817.5" y="295.0" width="53.0" height="20" rx="2" fill="#fafaf7" stroke="#fafaf7" stroke-width="1.5" /><text x="844.0" y="310.0" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#54545c" text-anchor="middle">CLOSE</text><circle cx="48" cy="328" r="6" fill="#0a0a0a"/><path d="M 56,328 L 88,328" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-auction-phases-arrow-gray)"/><path d="M 1192,328 L 1220,328" fill="none" stroke="#54545c" stroke-width="2" marker-end="url(#lesson-20-auction-phases-arrow-gray)"/><circle cx="1232" cy="328" r="8" fill="none" stroke="#0a0a0a" stroke-width="2"/><circle cx="1232" cy="328" r="4" fill="#0a0a0a"/><g data-node="submit"><rect x="88" y="224" width="288" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M100,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="116" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">PHASE 0</text><text x="116" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">SUBMIT</text><text x="116" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Store sealed bids.</text></g><g data-node="reveal"><rect x="496" y="224" width="288" height="208" rx="8" fill="#eeeeff" stroke="#0000fe" stroke-width="1.5" /><path d="M508,236 V420" stroke="#0000fe" stroke-width="3"/><text x="524" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">PHASE 1</text><text x="524" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">REVEAL</text><text x="524" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Verify openings; compare</text><text x="524" y="332" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">valid bids with the leader.</text></g><g data-node="closed"><rect x="904" y="224" width="288" height="208" rx="8" fill="#ffffff" stroke="#7a7a84" stroke-width="1.5" /><path d="M916,236 V420" stroke="#7a7a84" stroke-width="3"/><text x="932" y="252" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#54545c" text-anchor="start">PHASE 2</text><text x="932" y="280" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a" text-anchor="start">CLOSED</text><text x="932" y="308" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#54545c" text-anchor="start">Freeze the result.</text></g><path d="M40,584 H1240" stroke="#c7c7cc"/><text x="40" y="612" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0000fe" text-anchor="start">REMEMBER</text><text x="164" y="612" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="400" fill="#0a0a0a" text-anchor="start">The greatest valid revealed bid wins. Equal bids keep the first successfully revealed winner.</text><text x="40" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="start">Filled dot: initial state · Ringed dot: terminal state · Arrows: permitted transitions</text><text x="1240" y="692" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="400" fill="#54545c" text-anchor="end">LESSON 20</text></svg>
