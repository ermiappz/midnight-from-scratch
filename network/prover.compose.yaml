# Public-network proving stays on the participant's machine.
# Version from Midnight's support matrix, checked 2026-10-27.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.3
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
